name: Build and deploy PFx Paint Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pfx-paint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: vendor/hokusai

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: v0.15.0

      - name: Prepare Node 22 for browser interaction tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check local JavaScript
        run: |
          node --check src/app.js
          node --check src/engine.js
          node --check src/viewport.js
          node --check src/paint-cursor.js
          node --check src/autosave.js
          node --check sw.js
          node --check tests/browser-interactions.mjs
          node --check tests/browser-performance.mjs

      - name: Test Hokusai brush engine
        run: |
          if test -f vendor/hokusai/Cargo.lock; then
            cargo test --locked --manifest-path vendor/hokusai/Cargo.toml -p hokusai-core -p hokusai-brush -p hokusai-tile-mem
          else
            cargo test --manifest-path vendor/hokusai/Cargo.toml -p hokusai-core -p hokusai-brush -p hokusai-tile-mem
          fi

      - name: Compile bundled engine to WebAssembly
        run: |
          mkdir -p _site/pkg
          wasm-pack build vendor/hokusai/crates/hokusai-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/_site/pkg"

      - name: Assemble static site (no CDN)
        shell: bash
        run: |
          set -euo pipefail
          cp index.html sw.js _site/
          cp -R src public _site/
          touch _site/.nojekyll
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          sed -i "s/alpha-version\">0.1.0/alpha-version\">0.1.$PATCH/" _site/index.html
          sed -i "s/pfx-paint-cache-v1/pfx-paint-cache-v$GITHUB_RUN_NUMBER/" _site/sw.js
          test -s _site/src/autosave.js
          test -s _site/pkg/hokusai_wasm.js
          test -s _site/pkg/hokusai_wasm_bg.wasm
          test -s _site/public/brushes/charcoal.myb
          test -s _site/public/brushes/pastel.myb
          test -s _site/src/viewport.js
          test -s _site/src/paint-cursor.css
          test -s _site/src/paint-cursor.js
          if git ls-files --error-unmatch vendor/hokusai/Cargo.lock >/dev/null 2>&1; then
            git diff --exit-code -- vendor/hokusai/Cargo.lock
          fi
          if grep -REn 'https?://' _site/src _site/index.html _site/sw.js; then
            echo "External runtime URL detected"
            exit 1
          fi

      - name: Test real browser drawing and exported PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8732 --directory _site >/tmp/pfx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8732/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tests/browser-interactions.mjs "$CHROME"

      - name: Benchmark long drawing sessions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8732 --directory _site >/tmp/pfx-perf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8732/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tests/browser-performance.mjs "$CHROME"
          PFX_CPU_SLOWDOWN=3 PFX_BENCH_STROKES=180 node tests/browser-performance.mjs "$CHROME"

      - name: Retain real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-paint-browser-tests
          path: |
            test-artifacts/*.png
            test-artifacts/performance*.json
          if-no-files-found: ignore

      - name: Keep built browser runtime in this repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp _site/pkg/hokusai_wasm.js pkg/hokusai_wasm.js
          cp _site/pkg/hokusai_wasm_bg.wasm pkg/hokusai_wasm_bg.wasm
          git add -f pkg/hokusai_wasm.js pkg/hokusai_wasm_bg.wasm vendor/hokusai/Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: preserve self-hosted Hokusai WASM browser runtime"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
